<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>💌 A letter for you</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet" />

  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);

      --bg: #f0e6f6;
      --hint: #a3487a;
      --env: #d9534f;
      --side: #f5a3a2;
      --front: #ff6f61;
      --paper: #ffffff;
      --paper-ink: #7a2e48;
      --accent: #e60073;
      --yes: #ff4d88;
      --no-bg: #eeeeee;
      --no-ink: #555555;
      --outline: #d9534f;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #26142f;
        --hint: #f3b6d0;
        --paper: #fff7fa;
        --outline: #ff8a84;
      }
    }
    :root[data-theme="dark"] {
      --bg: #26142f;
      --hint: #f3b6d0;
      --paper: #fff7fa;
      --outline: #ff8a84;
    }

    html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100%;
      background-color: var(--bg);
      font-family: "Dancing Script", "Brush Script MT", cursive;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .stage {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0 28px;
    }
    @media (min-width: 700px) { .stage { zoom: 1.25; } }

    /* ---------- ENVELOPE ---------- */

    .envelope-wrapper {
      position: relative;
      width: 280px;
      height: 430px;
    }

    #envelope {
      position: absolute;
      left: 0;
      top: 240px;
      width: 280px;
      height: 180px;
      background-color: var(--env);
      border-radius: 0 0 6px 6px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      isolation: isolate;
    }
    #envelope.open { cursor: default; }

    .front {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    .flap {
      border-left: 140px solid transparent;
      border-right: 140px solid transparent;
      border-bottom: 82px solid transparent;
      border-top: 98px solid var(--env);
      transform-origin: top;
    }

    .pocket {
      border-left: 140px solid var(--side);
      border-right: 140px solid var(--side);
      border-bottom: 90px solid var(--front);
      border-top: 90px solid transparent;
      border-bottom-left-radius: 6px;
      border-bottom-right-radius: 6px;
      z-index: 3;
    }

    .hint {
      position: absolute;
      left: 0;
      right: 0;
      top: -74px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--hint);
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .close .hint { opacity: 1; }
    .open .hint { opacity: 0; }

    /* ---------- LETTER ---------- */

    .letter {
      position: absolute;
      left: 5%;
      top: 10px;
      width: 90%;
      height: 150px;
      z-index: 2;
      background-color: var(--paper);
      color: var(--paper-ink);
      border-radius: 6px;
      box-shadow: 0 2px 26px rgba(0, 0, 0, 0.14);
      padding: 14px 14px 0;
      text-align: center;
      overflow: hidden;
      pointer-events: none;
    }

    .letter .greeting {
      margin: 0 0 6px;
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .letter .ask {
      margin: 0 0 12px;
      font-size: 1.4rem;
      font-weight: 500;
      line-height: 1.25;
    }
    .letter .ask strong { font-weight: 700; color: var(--accent); }

    .proposal-buttons { display: flex; justify-content: center; gap: 8px; }
    .proposal-buttons[hidden] { display: none; }

    .proposal-buttons button {
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 700;
      border: none;
      border-radius: 20px;
      padding: 6px 18px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .proposal-buttons button:hover { transform: scale(1.08); }
    .proposal-buttons button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    #yes { background-color: var(--yes); color: #fff; }
    #no  { background-color: var(--no-bg); color: var(--no-ink); }

    #response {
      margin: 10px 0 0;
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.25;
      min-height: 1.25em;
    }
    #response.yes { color: var(--accent); font-size: 1.4rem; }
    #response.no  { color: var(--no-ink); }

    /* ---------- CLOSED / OPEN ANIMATION ---------- */
    /* Closing: letter slides back in first, then the flap shuts over it. */

    .close .flap {
      transform: perspective(800px) rotateX(0deg);
      transition: transform 0.5s 0.55s ease, z-index 0s 0.8s;
      z-index: 5;
    }
    .close .letter {
      transform: translateY(0);
      height: 150px;
      transition: transform 0.5s ease, height 0.5s ease;
      pointer-events: none;
    }

    /* Opening: flap lifts first, then the letter slides up out of the pocket. */

    .open .flap {
      transform: perspective(800px) rotateX(180deg);
      transition: transform 0.5s ease, z-index 0s 0.25s;
      z-index: 1;
    }
    .open .letter {
      transform: translateY(-210px);
      height: 320px;
      transition: transform 0.75s 0.55s cubic-bezier(0.2, 0.8, 0.2, 1), height 0.75s 0.55s ease;
      pointer-events: auto;
    }

    /* ---------- HEARTS THAT FLOAT OUT WHEN OPENED ---------- */

    .hearts {
      position: absolute;
      top: 100px;
      left: 0;
      right: 0;
      height: 0;
      z-index: 1;
      pointer-events: none;
    }
    .heart {
      position: absolute;
      top: 0;
      width: 0;
      height: 0;
      opacity: 0;
      pointer-events: none;
    }
    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      left: 50px;
      top: 0;
      width: 50px;
      height: 80px;
      background: var(--accent);
      border-radius: 50px 50px 0 0;
      transform: rotate(-45deg);
      transform-origin: 0 100%;
    }
    .heart::after {
      left: 0;
      transform: rotate(45deg);
      transform-origin: 100% 100%;
    }

    .close .heart { opacity: 0; animation: none; }

    .a1 { left: -14%; transform: scale(0.32); }
    .a2 { left: 78%;  transform: scale(0.45); }
    .a3 { left: 34%;  transform: scale(0.28); }

    .open .a1 { animation: floatUp 4.5s linear 1s 1 both, sideSway 2.2s ease-in-out 1s 4 alternate; }
    .open .a2 { animation: floatUp 5.5s linear 1.1s 1 both, sideSway 2.8s ease-in-out 1.1s 3 alternate; }
    .open .a3 { animation: floatUp 6.5s linear 1.3s 1 both, sideSway 2s ease-in-out 1.3s 6 alternate; }

    @keyframes floatUp {
      0%   { top: 0;      opacity: 0; }
      10%  { opacity: 1; }
      75%  { opacity: 1; }
      100% { top: -460px; opacity: 0; }
    }
    @keyframes sideSway {
      0%   { margin-left: 0; }
      100% { margin-left: 40px; }
    }

    /* ---------- OPEN / CLOSE BUTTONS ---------- */

    .reset { text-align: center; margin-top: 4px; }
    .reset button {
      font-family: inherit;
      font-weight: 800;
      transition: all 0.1s linear;
      -webkit-appearance: none;
      appearance: none;
      background-color: transparent;
      border: solid 2px var(--outline);
      border-radius: 4px;
      color: var(--outline);
      display: inline-block;
      font-size: 14px;
      text-transform: uppercase;
      margin: 5px;
      padding: 10px;
      line-height: 1em;
      min-width: 120px;
      cursor: pointer;
    }
    .reset button:hover { background-color: var(--outline); color: #fff; }
    .reset button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    /* ---------- CELEBRATION HEARTS (when she says yes) ---------- */

    .confetti {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 50;
    }
    .confetti span {
      position: absolute;
      bottom: -50px;
      opacity: 0;
      animation: rise linear forwards;
    }
    @keyframes rise {
      0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { transform: translateY(-115vh) rotate(35deg); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .heart, .confetti { display: none; }
      .close .flap, .open .flap, .close .letter, .open .letter { transition-duration: 0.01s; transition-delay: 0s; }
    }
  </style>
</head>

<body>
  <main class="stage">

    <div class="envelope-wrapper">
      <div id="envelope" class="close">

        <div class="hint">A little letter for you 💌<br />tap to open</div>

        <div class="front flap"></div>
        <div class="front pocket"></div>

        <div class="letter">
          <p class="greeting">Dear Love, ❤️</p>
          <p class="ask">Will you go on a date with me <strong>on 1st October?</strong></p>

          <div class="proposal-buttons" id="choices">
            <button id="yes" type="button">Yes ❤️</button>
            <button id="no" type="button">No 😭</button>
          </div>

          <p id="response" aria-live="polite"></p>
        </div>

        <div class="hearts">
          <div class="heart a1"></div>
          <div class="heart a2"></div>
          <div class="heart a3"></div>
        </div>

      </div>
    </div>

    <div class="reset">
      <button id="open" type="button">Open</button>
      <button id="reset" type="button">Close</button>
    </div>

  </main>

  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <script>
    (function () {
      var envelope = document.getElementById("envelope");
      var openButton = document.getElementById("open");
      var closeButton = document.getElementById("reset");
      var yesButton = document.getElementById("yes");
      var noButton = document.getElementById("no");
      var choices = document.getElementById("choices");
      var response = document.getElementById("response");
      var confetti = document.getElementById("confetti");

      function openEnvelope() {
        envelope.classList.add("open");
        envelope.classList.remove("close");
      }
      function closeEnvelope() {
        envelope.classList.add("close");
        envelope.classList.remove("open");
      }

      openButton.addEventListener("click", openEnvelope);
      closeButton.addEventListener("click", closeEnvelope);
      // Tapping the closed envelope opens it too.
      envelope.addEventListener("click", function () {
        if (envelope.classList.contains("close")) openEnvelope();
      });

      function burst() {
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        var symbols = ["❤️", "💖", "💗", "💕", "💘"];
        for (var i = 0; i < 36; i++) {
          var s = document.createElement("span");
          s.textContent = symbols[Math.floor(Math.random() * symbols.length)];
          s.style.left = Math.random() * 100 + "%";
          s.style.fontSize = 18 + Math.random() * 26 + "px";
          s.style.animationDuration = 3 + Math.random() * 3 + "s";
          s.style.animationDelay = Math.random() * 1.2 + "s";
          s.addEventListener("animationend", function (e) { e.target.remove(); });
          confetti.appendChild(s);
        }
      }

      yesButton.addEventListener("click", function () {
        response.className = "yes";
        response.textContent = "Yay!! It's a date 🥰 See you on 1st October! ❤️";
        choices.hidden = true;
        burst();
      });

      noButton.addEventListener("click", function () {
        response.className = "no";
        response.textContent = "Aww… 😭 are you sure? Think again 🥺";
      });
    })();
  </script>
</body>
</html>
